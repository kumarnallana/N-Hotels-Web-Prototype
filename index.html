                                <span>Call Direct: ${HOTEL.phone}</span>

                            </div>

                      <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-center">

                            <h4 class="font-bold text-slate-900 text-sm">VVS Grand 3rd Floor</h4>
                            <p class="text-xs text-slate-600 max-w-sm">
                              Park Centre, Pithapuram, Andhra Pradesh 533450
                            </p>
                            <p class="text-[11px] font-mono text-slate-500">17.1131253° N, 82.2557761° E</p>
                            <div class="pt-2">
                              <a 
                                href=${HOTEL.googleMapsUrl}

                  </div>

                      <div>
                        <p class="font-bold text-white text-sm">[N] Hotel's Luxury Rooms</p>

                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">

                    <div class="flex items-center space-x-2">
                      <span class="px-2.5 py-0.5 rounded text-[10px] font-bold uppercase bg-regal-900 text-white tracking-wider">

                      <span class="text-xs text-slate-500 font-medium">Front Desk & Managing Director View</span>
                    </div>

                      [N] Hotel's Front Office Queue

                      Real-time interactive booking requests received from the direct guest portal.

                    <p class="text-[11px] font-bold uppercase tracking-wider text-amber-800">Pending Follow-ups</p>
                    <p class="text-2xl font-black text-amber-900 mt-1">
                      ${enquiries.filter(e => e.status === 'New' || e.status === 'Contacted').length}
                    </p>
                    <p class="text-[11px] text-amber-800 font-medium mt-0.5">Requires Front Desk Call</p>
                  </div>

                    <p class="text-[11px] font-bold uppercase tracking-wider text-emerald-800">Confirmed Stays</p>
                    <p class="text-2xl font-black text-emerald-900 mt-1">

                    <p class="text-[11px] font-bold uppercase tracking-wider text-purple-800">Est. Direct Revenue</p>
                    <p class="text-2xl font-black text-purple-900 mt-1">
                      ₹${enquiries.reduce((acc, curr) => {
                        const val = parseInt(curr.totalAmount.replace(/[^0-9]/g, '')) || 0;

                    <p class="text-[11px] text-purple-800 font-medium mt-0.5">Zero OTA Commission Cut</p>
                  </div>

                </div>
              </div>

              <!-- Interactive Enquiry Table Card -->
              <div class="bg-white rounded-2xl border border-portal-border shadow-xs overflow-hidden">
                <div class="p-5 border-b border-portal-border flex flex-col sm:flex-row sm:items-center justify-between gap-3">

                    <h2 class="text-base font-bold text-slate-900">Live Enquiry Log</h2>
                    <p class="text-xs text-slate-500">Click actions below to test in-memory state updates.</p>

                  <div class="flex items-center space-x-2">
                    <span class="text-xs font-semibold text-slate-500">Filter: All Records (${enquiries.length})</span>

                </div>

                <div class="overflow-x-auto">

                    <thead class="bg-slate-50 text-slate-500 uppercase font-bold text-[10px] tracking-wider border-b border-portal-border">

                        <th class="py-3 px-4">Guest Name</th>

                        <th class="py-3 px-4">Check-In Slot</th>

                        <th class="py-3 px-4">Status</th>
                        <th class="py-3 px-4 text-right">Extranet Actions</th>
                      </tr>
                    </thead>
                    <tbody class="divide-y divide-portal-border">
                      ${enquiries.map((enq) => html`
                        <tr key=${enq.id} class="hover:bg-slate-50/80 transition-colors">
                          <td class="py-3 px-4 font-mono font-bold text-slate-900 whitespace-nowrap">
                            ${enq.id}
                          </td>
                          <td class="py-3 px-4 font-bold text-slate-900">
                            ${enq.guestName}
                            <p class="text-[11px] text-slate-500 font-normal mt-0.5">${enq.guests}</p>
                          </td>
                          <td class="py-3 px-4 font-mono text-slate-700 whitespace-nowrap">
                            <a href="tel:${enq.phone}" class="hover:text-regal-900 font-semibold underline">
                              ${enq.phone}
                            </a>
                          </td>
                          <td class="py-3 px-4">
                            <span class="font-semibold text-slate-800">${enq.roomType}</span>
                            <p class="text-[11px] text-slate-500 mt-0.5">${enq.dates}</p>
                          </td>
                          <td class="py-3 px-4 text-slate-600 whitespace-nowrap">
                            ${enq.slot}
                          </td>
                          <td class="py-3 px-4 font-bold text-slate-900 whitespace-nowrap">
                            ${enq.totalAmount}
                          </td>
                          <td class="py-3 px-4 whitespace-nowrap">
                            <span class=${`px-2.5 py-1 rounded-full text-[10px] font-bold uppercase ${
                              enq.status === 'Confirmed' ? 'bg-emerald-100 text-emerald-800' :
                              enq.status === 'Contacted' ? 'bg-blue-100 text-blue-800' :
                              enq.status === 'New' ? 'bg-amber-100 text-amber-800' :
                              'bg-slate-100 text-slate-700'
                            }`}>
                              ${enq.status}
                            </span>
                          </td>
                          <td class="py-3 px-4 text-right whitespace-nowrap">
                            <div class="flex items-center justify-end space-x-1.5">
                              ${enq.status !== 'Confirmed' && html`
                                <button 
                                  onClick=${() => updateEnquiryStatus(enq.id, 'Confirmed')}
                                  class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-2 py-1 rounded text-[10px] transition-colors"
                                  title="Confirm booking"
                                >
                                  Confirm
                                </button>
                              `}
                              ${enq.status === 'New' && html`
                                <button 
                                  onClick=${() => updateEnquiryStatus(enq.id, 'Contacted')}
                                  class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-2 py-1 rounded text-[10px] transition-colors"
                                  title="Mark as Contacted"
                                >
                                  Contacted
                                </button>
                              `}
                              <a 
                                href="tel:${enq.phone}" 
                                class="bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold px-2 py-1 rounded text-[10px] transition-colors"
                              >
                                Call
                              </a>
                            </div>
                          </td>
                        </tr>
                      `)}

                </div>

                <div class="p-4 bg-slate-50 border-t border-portal-border text-[11px] text-slate-500 flex flex-col sm:flex-row items-center justify-between gap-2">
                  <span>Simulated Front Desk Extranet in Browser Memory. No production database needed for MD review.</span>
                  <button 
                    onClick=${() => {
                      const sample = {
                        id: `NH-2026-0${817 + enquiries.length}`,
                        guestName: "Pilgrim Demo Guest",
                        phone: "+91 95158 44616",
                        roomType: "Deluxe AC Room",
                        dates: "Nov 12 to Nov 14 (2 nights)",
                        slot: "07:00 AM (Pilgrim Cycle)",
                        guests: "2 Adults",

                      setEnquiries([sample, ...enquiries]);
                      triggerToast("Demo enquiry injected into queue.");
                    }}

                    + Inject Test Guest Enquiry
                  </button>
                </div>

              </div>

            </div>
          `}

        </div>
      `;
    }

    ReactDOM.render(React.createElement(App), document.getElementById('root'));
  </script>
</body>
</html>
