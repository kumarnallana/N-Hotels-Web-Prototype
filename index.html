                <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mt-6 pt-6 border-t border-surface-border">
                  <div class="p-3.5 rounded-lg bg-surface-subtle">
                    <p class="text-[11px] font-bold uppercase text-slate-400">Total Enquiries</p>
                    <p class="text-xl font-bold text-slate-900 mt-0.5">${enquiries.length}</p>
                  </div>
                  <div class="p-3.5 rounded-lg bg-amber-50 border border-amber-100">
                    <p class="text-[11px] font-bold uppercase text-amber-700">Pending Follow-up</p>
                    <p class="text-xl font-bold text-amber-900 mt-0.5">
                      ${enquiries.filter(e => e.status === 'New' || e.status === 'Contacted').length}
                    </p>
                  </div>
                  <div class="p-3.5 rounded-lg bg-emerald-50 border border-emerald-100">
                    <p class="text-[11px] font-bold uppercase text-emerald-700">Confirmed Stays</p>
                    <p class="text-xl font-bold text-emerald-900 mt-0.5">
                      ${enquiries.filter(e => e.status === 'Confirmed').length}
                    </p>
                  </div>
                  <div class="p-3.5 rounded-lg bg-purple-50 border border-purple-100">
                    <p class="text-[11px] font-bold uppercase text-purple-700">Est. Direct Revenue</p>
                    <p class="text-xl font-bold text-purple-900 mt-0.5">
                      ₹${enquiries.reduce((acc, curr) => {
                        const val = parseInt(curr.totalAmount.replace(/[^0-9]/g, '')) || 0;
                        return acc + val;
                      }, 0).toLocaleString('en-IN')}
                    </p>
                  </div>
                </div>
              </div>

              <!-- Enquiry Queue Table -->
              <div class="bg-white rounded-xl border border-surface-border shadow-xs overflow-hidden">
                <div class="p-4 border-b border-surface-border flex items-center justify-between">
                  <h2 class="text-sm font-bold text-slate-900">Active Guest Enquiries</h2>
                  <span class="text-xs text-slate-400">${enquiries.length} Records</span>
                </div>

                <div class="overflow-x-auto">
                  <table class="w-full text-left text-xs">
                    <thead class="bg-surface-subtle text-slate-500 font-bold uppercase text-[10px] tracking-wider border-b border-surface-border">
                      <tr>
                        <th class="py-2.5 px-4">Ref Code</th>
                        <th class="py-2.5 px-4">Guest Name</th>
                        <th class="py-2.5 px-4">Phone</th>
                        <th class="py-2.5 px-4">Room & Dates</th>
                        <th class="py-2.5 px-4">Check-In Slot</th>
                        <th class="py-2.5 px-4">Total</th>
                        <th class="py-2.5 px-4">Status</th>
                        <th class="py-2.5 px-4 text-right">Action</th>
                      </tr>
                    </thead>
                    <tbody class="divide-y divide-surface-border">
                      ${enquiries.map((enq) => html`
                        <tr key=${enq.id} class="hover:bg-slate-50 transition-colors">
                          <td class="py-3 px-4 font-mono font-bold text-slate-900">${enq.id}</td>
                          <td class="py-3 px-4">
                            <span class="font-bold text-slate-900">${enq.guestName}</span>
                            <p class="text-[11px] text-slate-400">${enq.guests}</p>
                          </td>
                          <td class="py-3 px-4 font-mono">
                            <a href="tel:${enq.phone}" class="text-brand-plum font-semibold hover:underline">
                              ${enq.phone}
                            </a>
                          </td>
                          <td class="py-3 px-4">
                            <p class="font-semibold text-slate-800">${enq.roomType}</p>
                            <p class="text-[11px] text-slate-400">${enq.dates}</p>
                          </td>
                          <td class="py-3 px-4 text-slate-600">${enq.slot}</td>
                          <td class="py-3 px-4 font-bold text-slate-900">${enq.totalAmount}</td>
                          <td class="py-3 px-4">
                            <span class=${`px-2 py-0.5 rounded text-[10px] font-bold uppercase ${
                              enq.status === 'Confirmed' ? 'bg-emerald-100 text-emerald-800' :
                              enq.status === 'Contacted' ? 'bg-blue-100 text-blue-800' :
                              'bg-amber-100 text-amber-800'
                            }`}>
                              ${enq.status}
                            </span>
                          </td>
                          <td class="py-3 px-4 text-right">
                            <div class="flex items-center justify-end space-x-1.5">
                              ${enq.status !== 'Confirmed' && html`
                                <button 
                                  onClick=${() => updateEnquiryStatus(enq.id, 'Confirmed')}
                                  class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-2 py-1 rounded text-[10px]"
                                >
                                  Confirm
                                </button>
                              `}
                              <a 
                                href="tel:${enq.phone}" 
                                class="bg-surface-subtle hover:bg-slate-200 text-slate-800 font-semibold px-2 py-1 rounded text-[10px]"
                              >
                                Call
                              </a>
                            </div>
                          </td>
                        </tr>
                      `)}
                    </tbody>
                  </table>
                </div>

                <div class="p-3 bg-surface-subtle text-[11px] text-slate-500 border-t border-surface-border flex items-center justify-between">
                  <span>Interactive prototype queue operates in browser memory.</span>
                  <button 
                    onClick=${() => {
                      const sample = {
                        id: `NH-2026-0${817 + enquiries.length}`,
                        guestName: "Pilgrim Demo Guest",
                        phone: "+91 95158 44616",
                        roomType: "Deluxe AC Room",
                        dates: "Nov 12 to Nov 14 (2 nights)",
                        slot: "07:00 AM (Pilgrim Cycle)",
                        guests: "2 Adults",
                        totalAmount: "₹3,248 (Incl. GST)",
                        status: "New",
                        note: "Simulated test record."
                      };
                      setEnquiries([sample, ...enquiries]);
                      triggerToast("Demo enquiry injected into queue.");
                    }}
                    class="text-brand-plum font-bold hover:underline"
                  >
                    + Add Test Record
                  </button>
                </div>
              </div>

            </div>
          `}

        </div>
      `;
    }

    ReactDOM.render(React.createElement(App), document.getElementById('root'));
  </script>
</body>
</html>
